@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap');

.hr-root {
  --paper: #EAE7DE; --paper-2: #F2F0EA;
  --ink: #16295C; --ink-soft: rgba(22,41,92,0.55); --ink-hair: rgba(22,41,92,0.16);
  --pink: #FF48B0; --green: #00A95C; --yellow: #FFE800; --clay: #7A7263;
  background: var(--paper); color: var(--ink);
  font-family: 'Newsreader', Georgia, serif; font-size: 16px; line-height: 1.5;
  min-height: 100vh; padding: 0 0 96px; -webkit-font-smoothing: antialiased;
}
.hr-root *, .hr-root *::before, .hr-root *::after { box-sizing: border-box; }
.hr-wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

.mono { font-family:'DM Mono',ui-monospace,Menlo,monospace; font-variant-numeric: tabular-nums; }
.disp { font-family:'Bricolage Grotesque','Helvetica Neue',sans-serif; font-weight:800; letter-spacing:-0.035em; line-height:0.95; }
.lbl { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-soft); }
.num { font-family:'DM Mono',monospace; font-variant-numeric: tabular-nums; }

.masthead { border-bottom:2px solid var(--ink); padding: 26px 0 10px; }
.masthead-top { border-top: 6px solid var(--ink); }
.mast-title { font-size: clamp(36px,8.5vw,88px); text-transform: uppercase; }
.mast-meta { display:flex; flex-wrap:wrap; gap:6px 18px; align-items:baseline; padding-top:10px; border-top:1px solid var(--ink-hair); margin-top:12px; }

.tabs { display:flex; overflow-x:auto; border-bottom:1px solid var(--ink); margin-bottom:26px; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tab { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
  padding:11px 15px; background:none; border:0; border-right:1px solid var(--ink-hair); color:var(--ink-soft);
  cursor:pointer; white-space:nowrap; position:relative; top:1px; }
.tab:hover { color:var(--ink); background: rgba(22,41,92,0.05); }
.tab[data-on="1"] { color:var(--ink); background:var(--paper-2); border:1px solid var(--ink); border-bottom-color:var(--paper-2); font-weight:500; }
.tab .cnt { color:var(--pink); margin-left:6px; }

.card { background:var(--paper-2); border:1px solid var(--ink); padding:18px; }
.card + .card { margin-top:14px; }
.offset { box-shadow: 5px 5px 0 var(--pink); }
.offset-g { box-shadow: 5px 5px 0 var(--green); }
.offset-i { box-shadow: 5px 5px 0 var(--ink); }
.grid { display:grid; gap:14px; }
.g2 { grid-template-columns: repeat(2,minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3,minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4,minmax(0,1fr)); }
@media (max-width:900px){ .g3,.g4 { grid-template-columns: repeat(2,minmax(0,1fr)); } }
@media (max-width:560px){ .g2,.g3,.g4 { grid-template-columns: 1fr; } }

.sec-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;
  border-bottom:2px solid var(--ink); padding-bottom:6px; margin:34px 0 14px; }
.sec-head h2 { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; letter-spacing:-0.03em;
  font-size:22px; margin:0; text-transform:uppercase; }

.row { display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; padding:11px 12px; border-bottom:1px solid var(--ink-hair); }
.row:last-child { border-bottom:0; }
.row-hot { border-left:4px solid var(--pink); background: rgba(255,72,176,0.09); }
.row-warn { border-left:4px solid var(--ink); background: rgba(255,232,0,0.28); }
.row-ok { border-left:4px solid var(--green); }
.row-main { flex:1; min-width:150px; }
.row-title { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:15px; letter-spacing:-0.01em; }
.row-sub { font-family:'DM Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:2px; }
.row-amt { font-family:'DM Mono',monospace; font-variant-numeric:tabular-nums; font-size:15px; text-align:right; white-space:nowrap; }
.mark { background: linear-gradient(to bottom, transparent 58%, var(--yellow) 58%, var(--yellow) 94%, transparent 94%); }

.btn { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
  padding:8px 13px; border:1px solid var(--ink); background:var(--paper-2); color:var(--ink); cursor:pointer; }
.btn:hover { background:var(--ink); color:var(--paper); }
.btn:focus-visible,.tab:focus-visible,.in:focus-visible,.chip:focus-visible { outline:3px solid var(--pink); outline-offset:2px; }
.btn-p { background:var(--ink); color:var(--paper); }
.btn-p:hover { background:var(--pink); border-color:var(--pink); color:#fff; }
.btn-s { padding:5px 9px; font-size:10px; }
.btn:disabled { opacity:0.45; cursor:not-allowed; }
.btn-link { background:none; border:0; padding:0; font-family:'DM Mono',monospace; font-size:11px;
  color:var(--ink-soft); text-decoration:underline; cursor:pointer; letter-spacing:0.04em; }
.btn-link:hover { color:var(--pink); }

.in { width:100%; font-family:'DM Mono',monospace; font-size:13px; padding:9px 10px;
  border:1px solid var(--ink); background:#fff; color:var(--ink); border-radius:0; }
.in::placeholder { color: rgba(22,41,92,0.35); }
textarea.in { font-family:'Newsreader',serif; font-size:15px; resize:vertical; }
.fld { margin-bottom:12px; }
.fld .lbl { display:block; margin-bottom:5px; }

.chip { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:0.06em; padding:6px 10px;
  border:1px solid var(--ink-hair); background:transparent; color:var(--ink-soft); cursor:pointer; }
.chip:hover { border-color:var(--ink); color:var(--ink); }
.chip[data-on="1"] { background:var(--ink); border-color:var(--ink); color:var(--paper); }
.chips { display:flex; flex-wrap:wrap; gap:6px; }

.scrim { position:fixed; inset:0; background: rgba(22,41,92,0.45); display:flex; align-items:flex-start;
  justify-content:center; padding:24px 16px; overflow-y:auto; z-index:60; }
.modal { background:var(--paper); border:1px solid var(--ink); box-shadow:8px 8px 0 var(--ink);
  width:100%; max-width:580px; padding:22px; margin:auto; }

.pill { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
  border:1px solid var(--ink-hair); padding:2px 7px; color:var(--ink-soft); white-space:nowrap; }
.pill-hot { border-color:var(--pink); color:var(--pink); }
.pill-ok { border-color:var(--green); color:var(--green); }
.who { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
  padding:2px 7px; border:1px solid currentColor; white-space:nowrap; }
.bar { height:8px; background: rgba(22,41,92,0.12); border:1px solid var(--ink-hair); }
.bar > i { display:block; height:100%; background:var(--ink); }
.stack { display:flex; height:10px; border:1px solid var(--ink); }
.stack > i { display:block; height:100%; }
.empty { border:1px dashed var(--ink-hair); padding:30px 20px; text-align:center; }
.prose { font-size:17px; line-height:1.62; }
.prose p { margin:0 0 12px; }
.spin { display:inline-block; width:9px; height:9px; background:var(--pink); animation: blink .9s steps(2) infinite; }
@keyframes blink { 50% { opacity:.15; } }
@media (prefers-reduced-motion: reduce){ .spin { animation:none; } }
.drop { border:1px dashed var(--ink); padding:16px; text-align:center; background: rgba(255,255,255,0.4); position:relative; }
.drop-over { background: rgba(255,232,0,0.35); border-style:solid; }
.drop label:focus-within { outline:3px solid var(--pink); outline-offset:2px; }
